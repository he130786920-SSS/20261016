<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <!-- 讓網頁在手機裝置上正常使用響應式版面 -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <title>p5.js 簡易指令練習測驗</title>

  <!-- 預先連線到 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- 載入指定的 Google 字型 -->
  <link
    href="https://fonts.googleapis.com/css2?family=Isometra&family=LXGW+WenKai+Mono+TC&display=swap"
    rel="stylesheet"
  />

  <!-- 載入 p5.js 程式庫 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.min.js"></script>

  <!-- 載入主要程式 -->
  <script src="sketch.js"></script>

  <style>
    /* 讓網頁與畫布完全填滿瀏覽器視窗 */
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #bc6c25;
    }

    /* 移除畫布可能產生的空白間距 */
    canvas {
      display: block;
    }
  </style>
</head>

<body>
</body>
</html>
